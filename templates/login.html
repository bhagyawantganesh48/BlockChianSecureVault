{% extends 'base.html' %}
{% block title %}Login — Password Vault{% endblock %}

{% block auth_content %}
<div class="auth-card glass-panel animate-fade-in">
    <div class="text-center mb-4">
        <i class="bi bi-shield-lock-fill display-4 text-info"></i>
        <h2 class="mt-2">SecureVault</h2>
        <p class="text-muted">Blockchain-Based Password Manager</p>
    </div>
    <form method="POST" action="{{ url_for('auth.login') }}" class="needs-validation" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username" name="username"
                       value="{{ username or '' }}" required autofocus>
            </div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" required>
                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#password">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>
        <button type="submit" class="btn btn-info w-100 mb-3">
            <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
        <p class="text-center mb-0">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}" class="text-info">Register</a>
        </p>
    </form>
</div>
{% endblock %}
