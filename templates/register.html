{% extends 'base.html' %}
{% block title %}Register — Password Vault{% endblock %}

{% block auth_content %}
<div class="auth-card glass-panel animate-fade-in">
    <div class="text-center mb-4">
        <i class="bi bi-person-plus-fill display-4 text-info"></i>
        <h2 class="mt-2">Create Account</h2>
        <p class="text-muted">Join the secure password vault</p>
    </div>
    <form method="POST" action="{{ url_for('auth.register') }}" class="needs-validation" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   value="{{ username or '' }}" required minlength="3" maxlength="32">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email"
                   value="{{ email or '' }}" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Master Password</label>
            <input type="password" class="form-control strength-input" id="password"
                   name="password" required minlength="8">
            <div id="strengthMeter" class="strength-meter mt-2"></div>
        </div>
        <div class="mb-3">
            <label for="confirm_password" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirm_password"
                   name="confirm_password" required>
        </div>
        <button type="submit" class="btn btn-info w-100 mb-3">
            <i class="bi bi-shield-check"></i> Register
        </button>
        <p class="text-center mb-0">
            Already have an account?
            <a href="{{ url_for('auth.login') }}" class="text-info">Login</a>
        </p>
    </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/strength.js') }}"></script>
{% endblock %}
