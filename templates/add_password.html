{% extends 'base.html' %}
{% block title %}Add Password — Password Vault{% endblock %}
{% block page_heading %}Add Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="glass-panel p-4">
            <form method="POST" action="{{ url_for('vault.add_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Website *</label>
                        <input type="text" class="form-control" name="website"
                               value="{{ website or '' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Username *</label>
                        <input type="text" class="form-control" name="username"
                               value="{{ username or '' }}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Password *</label>
                        <div class="input-group">
                            <input type="password" class="form-control strength-input" id="vaultPassword"
                                   name="password" required>
                            <button class="btn btn-outline-secondary toggle-password" type="button"
                                    data-target="#vaultPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div id="strengthMeter" class="strength-meter mt-2"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Category</label>
                        <select class="form-select" name="category">
                            {% for cat in categories %}
                            <option value="{{ cat }}" {% if category == cat %}selected{% endif %}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control" name="notes" rows="3">{{ notes or '' }}</textarea>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-info">
                        <i class="bi bi-shield-lock"></i> Encrypt & Save
                    </button>
                    <a href="{{ url_for('vault.passwords') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/strength.js') }}"></script>
{% endblock %}
